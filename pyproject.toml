[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beranda"
version = "0.17.5"
description = "A lean, beautiful, offline-tolerant dashboard for a smart mirror or a big tablet. Runs on a Raspberry Pi 3B."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Beranda contributors" }]
keywords = ["smart-mirror", "raspberry-pi", "dashboard", "kiosk", "weather"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "holidays>=0.50",
  "icalendar>=5.0",
  "recurring-ical-events>=2.2",
  "astral>=3.2",
  "tomli-w>=1.0",
  "defusedxml>=0.7",
  "segno>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "playwright>=1.44", "ruff>=0.16,<0.18"]

[project.scripts]
beranda = "beranda.__main__:main"
beranda-wifi-setup = "beranda.wifi_setup:main"
beranda-wifi-job = "beranda.wifi:job_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beranda = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Beyond the default checks, the ones that catch real trouble rather than style:
# S = security (flake8-bandit), B = likely bugs, BLE = catching every exception blindly,
# ASYNC = calls that freeze the server while they run, DTZ = dates with no time zone,
# RUF100 = "noqa" comments that no longer apply to anything.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "B", "BLE", "ASYNC", "DTZ", "RUF100"]
ignore = [
  # Every command in Beranda is run from a list of arguments, never as a line handed to a
  # shell, so nothing a user types can ever become part of a command. S603 flags them all.
  "S603",
  # Commands are named ("nmcli"), not written out in full ("/usr/bin/nmcli"), because the
  # path differs between systems. The services that run as root set their own PATH (see
  # system/beranda-actions.service.in), which is the part that actually matters.
  "S607",
]

[tool.ruff.lint.per-file-ignores]
# Tests are meant to assert, and to use made-up passwords and commands.
"tests/*" = ["S101", "S105", "S106", "S108", "E402"]
# Developer scripts (screenshots, feed checks) are never installed on a Pi.
"scripts/*" = ["S101", "S310"]
