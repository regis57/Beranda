# Beranda configuration. Copy to ~/.config/beranda/config.toml (or /etc/beranda/config.toml),
# or point to it with `beranda --config path` or the BERANDA_CONFIG environment variable.
# Every key is optional: the defaults give you a working display for Metz, France.

country = "FR"          # ISO 3166-1 code: drives public holidays, week start and units
language = "fr"         # en fr de es it pt pt-BR ja id ar sw am af (others fall back to English)
                        # text, with dates still written in that language
# subdivision = "57"    # optional region/state for regional public holidays
# units = "metric"      # metric | imperial (default: imperial in the US, metric elsewhere)
theme = "japan"         # japan indonesia france germany spain italy portugal brazil
mode = "auto"           # auto (follows the sun) | light | night

[location]
name = "Metz"
latitude = 49.1193
longitude = 6.1757
timezone = "Europe/Paris"

[calendar]
# Any .ics link works: Google ("Secret address in iCal format"), iCloud (public calendar),
# Outlook, Nextcloud... Read-only, no account to connect. Treat these links like passwords.
ics_urls = [
  # "https://calendar.google.com/calendar/ical/.../basic.ics",
]

# Dates that matter to you. "MM-DD" repeats every year; "YYYY-MM-DD" also shows the number
# of years. kind: birth | death | anniversary | other
[[key_dates]]
date = "2018-06-02"
label = "Léa"
kind = "birth"

[server]
host = "0.0.0.0"
port = 8080

# News headlines at the bottom of the screen. Leave `sources` out to let Beranda choose
# (news about your town, two media of your country, one international medium in your language).
[news]
enabled = true
# sources = ["city", "franceinfo", "lemonde", "france24-fr"]   # ids: see the settings page
# feeds = ["https://example.org/rss"]                           # any RSS or Atom link

# Photo carousel: a local folder, shown full-screen in alternation with the dashboard. Fill
# it with rclone (Google Drive, Dropbox, OneDrive, iCloud shared albums...) or Syncthing
# (your phone's camera roll) — Beranda only reads what's already there.
# [photos]
# folder = "/home/pi/Pictures/beranda"
# interval = 20   # seconds each photo stays on screen

# World radio: favourite stations picked from the settings page (search Radio Browser, add
# the ones you like). Plays through `mpv` on the Pi itself, not through the browser.
# [radio]
# volume = 70   # 0-100
# [[radio.stations]]
# uuid = "9617a958-0601-11e8-ae97-52543be04c81"
# name = "France Inter"
# url = "https://icecast.radiofrance.fr/franceinter-midfi.mp3"

# TV prime time: your own XMLTV guide (your provider's, or a free community one such as
# iptv-org/epg). Beranda only ever reads it, never scrapes or hosts a guide itself. Use the
# settings page's "Find channels" button to get the channel ids below.
# [tv]
# url = "https://example.org/guide.xml"   # .xml or .xml.gz
# channels = ["channel.id.from.the.guide"]
# prime_start = "20:00"   # "HH:MM", local time
# prime_end = "23:00"     # not after prime_start means it runs past midnight

# Offline voice control: only takes effect if you also installed it with
# install.sh --with-voice (it's a separate service - see the README). wake_word must be one
# of "alexa", "hey_jarvis" or "hey_mycroft": the three pretrained wake words Beranda can use.
# [voice]
# enabled = true
# wake_word = "hey_jarvis"

# "On this day": historical events for your own country, looked up for free on Wikidata and
# woven into the news ticker. On by default; set to false to turn it off.
# [history]
# enabled = true

# Optional: a PIN for the /admin page. That page only opens from your home network anyway.
# [admin]
# pin = "2468"
