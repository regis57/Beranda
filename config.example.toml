# Beranda configuration. Copy to ~/.config/beranda/config.toml (or /etc/beranda/config.toml),
# or point to it with `beranda --config path` or the BERANDA_CONFIG environment variable.
# Every key is optional: the defaults give you a working display for Metz, France.

country = "FR"          # ISO 3166-1 code: drives public holidays, week start and units
language = "fr"         # en fr de es it pt pt-BR ja id ar sw am af (others fall back to English)
                        # text, with dates still written in that language
# subdivision = "57"    # optional region/state for regional public holidays
# units = "metric"      # metric | imperial (default: imperial in the US, metric elsewhere)
theme = "japan"         # japan indonesia france germany spain italy portugal brazil
mode = "auto"           # auto (follows the sun) | light | night

[location]
name = "Metz"
latitude = 49.1193
longitude = 6.1757
timezone = "Europe/Paris"

[calendar]
# Any .ics link works: Google ("Secret address in iCal format"), iCloud (public calendar),
# Outlook, Nextcloud... Read-only, no account to connect. Treat these links like passwords.
ics_urls = [
  # "https://calendar.google.com/calendar/ical/.../basic.ics",
]

# Dates that matter to you. "MM-DD" repeats every year; "YYYY-MM-DD" also shows the number
# of years. kind: birth | death | anniversary | other
[[key_dates]]
date = "2018-06-02"
label = "Léa"
kind = "birth"

[server]
host = "0.0.0.0"
port = 8080

# News headlines at the bottom of the screen. Leave `sources` out to let Beranda choose
# (news about your town, two media of your country, one international medium in your language).
[news]
enabled = true
# sources = ["city", "franceinfo", "lemonde", "france24-fr"]   # ids: see the settings page
# feeds = ["https://example.org/rss"]                           # any RSS or Atom link

# Photo frame: a small frame on the main screen. Easiest: open the settings page and tap
# "Add photos" (works with pictures from your phone's gallery, Google Photos, iCloud...).
# Or follow a shared Dropbox folder. Beranda keeps the pictures in its own folder, so there
# is normally nothing to write here.
# [photos]
# interval = 20            # seconds each photo stays on screen
# dropbox_url = "https://www.dropbox.com/scl/fo/..."   # a shared Dropbox folder link
# folder = "/home/pi/Pictures/beranda"   # advanced: use another folder instead (rclone, Syncthing)

# World radio: favourite stations picked from the settings page (search Radio Browser, add
# the ones you like). The sound plays in the page itself, on the tablet that shows Beranda,
# with a volume slider on the screen. `volume` is the starting level.
# [radio]
# volume = 70   # 0-100
# [[radio.stations]]
# uuid = "9617a958-0601-11e8-ae97-52543be04c81"
# name = "France Inter"
# url = "https://icecast.radiofrance.fr/franceinter-midfi.mp3"

# TV tonight: what is on from 20:00 for the next 3 hours (local time), for the channels you
# pick. The settings page suggests a free guide for your country; you only choose channels.
# Beranda only ever reads a guide (XMLTV format), never scrapes or hosts one itself.
# [tv]
# url = "https://example.org/guide.xml"   # .xml or .xml.gz
# channels = ["channel.id.from.the.guide"]

# Voice control: shows a microphone button on the screen. It listens through the microphone of
# the tablet showing Beranda (Chrome or Edge), not the Raspberry Pi. See the settings page.
# [voice]
# enabled = true
#
# Your own phrases (also editable on the settings page). "say" just answers with a sentence;
# the other actions are radio_play (+ the uuid of one favourite), radio_stop, radio_next,
# radio_prev, volume_up, volume_down, weather, time and tv. See docs/VOICE.md.
# [[voice.commands]]
# phrase = "good night"
# action = "say"
# reply = "Sleep well"

# "On this day": a few events from today's date in history, from Wikipedia in your language.
# On by default; set to false to turn it off.
# [history]
# enabled = true

# Optional: a PIN for the /admin page. That page only opens from your home network anyway.
# [admin]
# pin = "2468"
