name: news feeds

# Feed addresses change without notice: check the whole catalog every week, and on any
# pull request that touches it. This job never blocks a merge; it tells us what to fix.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/beranda/providers/news_catalog.py"
      - "src/beranda/providers/news.py"
      - "scripts/check_feeds.py"

# These jobs only read the code: the token they get can do nothing else.
permissions:
  contents: read

jobs:
  check:
    # Pinned, not "ubuntu-latest": GitHub retires the previous Ubuntu image from
    # "latest" on 2026-10-19, and this job shouldn't change runners silently.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/check_feeds.py
