# CodeQL: GitHub's own security analysis, free for public repositories. It reads the Python
# and the browser JavaScript and looks for the patterns behind real flaws (a path that escapes
# its folder, a command built from something a visitor typed, a secret that reaches a log...).
# Findings appear in the repository's "Security" tab, and on the pull request that caused them.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Once a week: new rules find old code, so a quiet week still deserves a look.
    - cron: "23 5 * * 2"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # only to file what it finds in the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b  # v3.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b  # v3.38.3
        with:
          category: /language:${{ matrix.language }}
