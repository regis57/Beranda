# Publishes docs/wiki/ to the GitHub wiki, so the wiki changes in the same pull request as the code.
name: Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Copy docs/wiki to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "regis57"
          git config user.email "regis57@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git commit -m "Wiki: update from docs/wiki"
          git push
