# gitleaks looks for anything that reads like a secret - a password, a private key, an API
# token - in the code and in every commit ever made. It completes GitHub's own scanner, which
# only knows the shapes of known providers (AWS, Stripe, GitHub...) and only looks at new
# commits. Free for a personal account: no key to set up.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Once a week: the list of what looks like a secret grows, and old commits stay forever.
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
