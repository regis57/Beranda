<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Beranda · Settings</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/admin.css">
  <script type="module" src="/static/admin.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="/static/favicon.svg" alt="" width="28" height="28"><b>Beranda</b></div>
    <a class="link" id="open-display" href="/" target="_blank" rel="noopener"></a>
  </header>

  <div id="gate" class="gate" hidden>
    <form id="gate-form">
      <label for="pin-input" id="gate-label"></label>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password">
      <button class="primary" id="gate-btn"></button>
      <p class="error" id="gate-error" hidden></p>
    </form>
  </div>

  <main id="app" class="layout" hidden>
    <form id="form" class="forms" autocomplete="off">

      <section class="card welcome" id="welcome" hidden>
        <h2 data-i18n="admin.welcome_title"></h2>
        <ol class="steps">
          <li data-i18n="admin.welcome_1"></li>
          <li data-i18n="admin.welcome_2"></li>
          <li data-i18n="admin.welcome_3"></li>
        </ol>
      </section>

      <section class="card" id="sec-place">
        <h2><span class="num">1</span><span data-i18n="admin.place"></span></h2>
        <p class="hint" data-i18n="admin.place_hint"></p>
        <div class="row">
          <input id="q" type="search" data-ph="admin.search_placeholder" aria-label="search">
          <button type="button" id="q-go" data-i18n="admin.search"></button>
        </div>
        <ul id="q-results" class="results" hidden></ul>
        <p class="error" id="q-error" hidden></p>
        <div class="grid3">
          <label><span data-i18n="admin.name"></span><input id="loc-name" required></label>
          <label><span data-i18n="admin.latitude"></span><input id="loc-lat" type="number" step="0.0001" min="-90" max="90" required></label>
          <label><span data-i18n="admin.longitude"></span><input id="loc-lon" type="number" step="0.0001" min="-180" max="180" required></label>
        </div>
        <label><span data-i18n="admin.timezone"></span>
          <span class="row"><select id="loc-tz"></select><button type="button" id="tz-device" data-i18n="admin.use_device_tz"></button></span>
        </label>
        <details class="help"><summary data-i18n="admin.help"></summary><p data-i18n="admin.place_help"></p></details>
      </section>

      <section class="card" id="sec-region">
        <h2><span class="num">2</span><span data-i18n="admin.region"></span></h2>
        <div class="grid2">
          <label><span data-i18n="admin.country"></span><select id="country"></select></label>
          <label><span data-i18n="admin.subdivision"></span><select id="subdivision"></select></label>
          <label><span data-i18n="admin.language"></span><select id="language"></select></label>
          <label><span data-i18n="admin.units"></span><select id="units"></select></label>
        </div>
        <p class="hint" data-i18n="admin.region_hint"></p>
        <details class="help"><summary data-i18n="admin.help"></summary><p data-i18n="admin.region_help"></p></details>
      </section>

      <section class="card" id="sec-look">
        <h2><span class="num">3</span><span data-i18n="admin.look"></span></h2>
        <p class="hint" data-i18n="admin.look_hint"></p>
        <div class="themes" id="themes" role="radiogroup"></div>
        <div class="seg" id="modes" role="radiogroup"></div>
      </section>

      <section class="card" id="sec-cal">
        <h2><span class="num">4</span><span data-i18n="admin.calendar"></span></h2>
        <p class="hint" data-i18n="admin.calendar_hint"></p>
        <div id="ics-list"></div>
        <button type="button" id="ics-add" data-i18n="admin.add"></button>
        <details class="help guide" id="cal-guide" open>
          <summary data-i18n="admin.cal_where"></summary>
          <ul class="providers" id="cal-providers"></ul>
          <p class="hint" data-i18n="admin.cal_privacy"></p>
        </details>
      </section>

      <section class="card" id="sec-keys">
        <h2><span class="num">5</span><span data-i18n="admin.key_dates"></span></h2>
        <p class="hint" data-i18n="admin.key_dates_hint"></p>
        <div id="key-list"></div>
        <button type="button" id="key-add" data-i18n="admin.add_date"></button>
      </section>

      <section class="card" id="sec-news">
        <h2><span class="num">6</span><span data-i18n="admin.news"></span></h2>
        <p class="hint" data-i18n="admin.news_hint"></p>
        <label class="check"><input type="checkbox" id="news-on"><span data-i18n="admin.news_enabled"></span></label>
        <div id="news-body">
          <label class="check"><input type="checkbox" id="news-auto"><span data-i18n="admin.news_auto"></span></label>
          <p class="hint" id="news-auto-hint"></p>
          <div class="chips" id="news-chips" aria-live="polite"></div>
          <div id="news-manual">
            <h3 data-i18n="admin.news_city_title"></h3>
            <div id="news-city"></div>
            <h3 id="news-country-title"></h3>
            <div id="news-country"></div>
            <h3 data-i18n="admin.news_world"></h3>
            <div id="news-world"></div>
            <h3 data-i18n="admin.news_other"></h3>
            <select id="news-other-country"></select>
            <div id="news-other"></div>
          </div>
          <h3 data-i18n="admin.news_custom"></h3>
          <div id="feed-list"></div>
          <button type="button" id="feed-add" data-i18n="admin.news_add"></button>
          <details class="help"><summary data-i18n="admin.news_custom_where"></summary><p data-i18n="admin.news_custom_hint"></p></details>
        </div>
      </section>

      <section class="card" id="sec-photos">
        <h2><span class="num">7</span><span data-i18n="admin.photos"></span></h2>
        <p class="hint" data-i18n="admin.photos_hint"></p>
        <div class="grid3">
          <label><span data-i18n="admin.photos_folder"></span><input id="photos-folder" type="text" inputmode="text" spellcheck="false"></label>
          <label><span data-i18n="admin.photos_interval"></span><input id="photos-interval" type="number" min="5" step="1"></label>
        </div>
        <p class="hint" id="photos-count"></p>
        <details class="help"><summary data-i18n="admin.help"></summary><p data-i18n="admin.photos_help"></p></details>
      </section>

      <section class="card" id="sec-radio">
        <h2><span class="num">8</span><span data-i18n="admin.radio"></span></h2>
        <p class="hint" data-i18n="admin.radio_hint"></p>
        <h3 data-i18n="admin.radio_favorites"></h3>
        <div id="radio-list"></div>
        <p class="hint" id="radio-empty" data-i18n="admin.radio_none"></p>
        <label class="volume-row"><span data-i18n="admin.radio_volume"></span>
          <input id="radio-volume" type="range" min="0" max="100" step="5">
        </label>
        <p class="hint" id="radio-now" role="status"></p>
        <h3 data-i18n="admin.radio_search"></h3>
        <div class="row wrap">
          <input id="radio-q" type="text" data-ph="admin.radio_search_ph">
          <select id="radio-country"></select>
          <select id="radio-language"></select>
          <button type="button" id="radio-go" data-i18n="admin.search"></button>
        </div>
        <div id="radio-results" aria-live="polite"></div>
        <details class="help"><summary data-i18n="admin.help"></summary><p data-i18n="admin.radio_help"></p></details>
      </section>

      <section class="card" id="sec-screen">
        <h2><span class="num">9</span><span data-i18n="admin.screen"></span></h2>
        <p class="hint" data-i18n="admin.screen_hint"></p>
        <div class="grid3">
          <label><span data-i18n="admin.rotate"></span><select id="rotate"></select></label>
          <label><span data-i18n="admin.off_at"></span><input id="off-at" type="time"></label>
          <label><span data-i18n="admin.on_at"></span><input id="on-at" type="time"></label>
        </div>
        <details class="help"><summary data-i18n="admin.help"></summary><p data-i18n="admin.screen_help"></p></details>
      </section>

      <section class="card" id="sec-system">
        <h2><span class="num">10</span><span data-i18n="admin.system"></span></h2>
        <p class="hint" id="sys-version"></p>
        <div class="row wrap" id="sys-buttons">
          <button type="button" id="sys-check" data-i18n="admin.check_updates"></button>
          <button type="button" id="sys-update" data-action="update" data-i18n="admin.update_now" hidden></button>
          <button type="button" id="sys-screen" data-action="restart-screen" data-i18n="admin.restart_screen"></button>
          <button type="button" id="sys-reboot" data-action="reboot" data-i18n="admin.reboot"></button>
          <button type="button" id="sys-reset" data-action="reset" data-i18n="admin.factory_reset"></button>
        </div>
        <p class="hint" id="sys-message" role="status"></p>
        <details class="help"><summary data-i18n="admin.help"></summary><p data-i18n="admin.factory_reset_help"></p></details>
      </section>

      <section class="card" id="sec-sec">
        <h2><span class="num">11</span><span data-i18n="admin.security"></span></h2>
        <label><span data-i18n="admin.pin"></span><input id="pin" type="password" inputmode="numeric" autocomplete="new-password"></label>
        <p class="hint" data-i18n="admin.pin_hint"></p>
      </section>

      <div class="savebar">
        <span id="state" role="status"></span>
        <button class="primary" id="save" data-i18n="admin.save"></button>
      </div>
    </form>

    <aside class="preview" aria-label="preview">
      <div class="preview-head"><h2 data-i18n="admin.preview"></h2><span class="hint" data-i18n="admin.preview_hint"></span></div>
      <div class="frame" id="frame"><iframe id="preview" title="preview" tabindex="-1"></iframe></div>
    </aside>
  </main>
</body>
</html>
