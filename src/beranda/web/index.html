<!doctype html>
<html lang="fr" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Beranda</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/layout.css">
  <link rel="stylesheet" href="/static/themes/japan.css" id="theme-css">
  <script type="module" src="/static/display.js"></script>
</head>
<body>
  <main class="board" id="board">

    <header class="clock">
      <div class="time"><span id="hm">--:--</span><span class="period" id="period"></span></div>
      <div class="date" id="date"></div>
    </header>

    <section class="now" aria-label="Météo">
      <div class="now-row">
        <div class="now-icon" id="now-icon"></div>
        <div class="now-temp"><span id="now-temp">–</span><span class="now-unit" id="now-unit">°</span></div>
        <div class="now-text">
          <div class="now-label" id="now-label"></div>
          <div class="now-detail" id="now-detail"></div>
        </div>
      </div>
      <div class="rain">
        <div class="rain-bars" id="rain-bars"></div>
        <div class="rain-scale"><span id="rain-from"></span><span id="rain-to"></span></div>
        <div class="rain-text" id="rain-text"></div>
      </div>
    </section>

    <section class="week" id="week" aria-label="Prévisions sur 7 jours"></section>

    <aside class="side">
      <section class="sky" id="sky">
        <div class="season" id="season">
          <div class="season-kanji" id="season-kanji"></div>
          <div class="season-text">
            <span class="seal" id="season-seal" aria-hidden="true"></span>
            <div class="season-name" id="season-name"></div>
            <div class="season-romaji" id="season-romaji"></div>
            <div class="season-note" id="season-note"></div>
            <div class="season-next" id="season-next"></div>
          </div>
        </div>
        <div class="moon">
          <svg class="moon-svg" id="moon-svg" viewBox="-60 -60 120 120" role="img" aria-hidden="true"></svg>
          <div class="moon-name" id="moon-name"></div>
          <div class="moon-detail" id="moon-detail"></div>
          <div class="sun" id="sun"></div>
        </div>
      </section>

      <!-- "On this day": a few things that happened today in history (from Wikipedia). -->
      <section class="facts" id="facts" hidden>
        <h2 class="facts-title" id="facts-title"></h2>
        <ul class="facts-list" id="facts-list"></ul>
      </section>

      <section class="upcoming" aria-label="À venir">
        <ul class="upcoming-list" id="upcoming"></ul>
      </section>

      <!-- Two little widgets: a photo frame and a radio. Each hides itself when it has nothing
           to show (no pictures yet / no favourite stations chosen). -->
      <div class="widgets" id="widgets">
        <figure class="phototile" id="phototile" hidden>
          <img id="photo-a" alt="" class="on">
          <img id="photo-b" alt="">
        </figure>

        <section class="radio" id="radio" hidden>
          <button type="button" class="round" id="radio-toggle" aria-label="Radio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="radio-icon" d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="radio-main">
            <div class="radio-name" id="radio-name"></div>
            <div class="radio-line">
              <button type="button" class="radio-mute" id="radio-mute" aria-label="Volume">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path id="radio-speaker" d="M4 9v6h4l5 4V5L8 9z"/></svg>
              </button>
              <input type="range" id="radio-volume" min="0" max="100" step="1" aria-label="Volume">
              <button type="button" class="radio-skip" id="radio-next" aria-label="Next station">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l9 6-9 6zM17 6h2v12h-2z"/></svg>
              </button>
            </div>
          </div>
        </section>
      </div>
      <audio id="radio-audio" preload="none"></audio>
    </aside>

    <section class="news" id="news" hidden>
      <span class="news-src" id="news-src"></span>
      <span class="news-title" id="news-title"></span>
      <span class="news-age" id="news-age"></span>
    </section>

    <footer class="status">
      <span class="badge" id="badge-demo" hidden></span>
      <span class="badge" id="badge-offline" hidden></span>
      <span class="place" id="place"></span>
      <button type="button" class="round mic" id="mic" aria-label="Microphone" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>
      </button>
    </footer>
  </main>

  <!-- A short message from the voice assistant ("Listening…", what it understood, its answer). -->
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- First start only: where to open the settings page. -->
  <section class="setup" id="setup" hidden>
    <img class="setup-qr" id="setup-qr" alt="" width="264" height="264">
    <div class="setup-text">
      <h2 id="setup-title"></h2>
      <p id="setup-help"></p>
      <ul id="setup-urls"></ul>
    </div>
  </section>

  <!-- First start, no network at all yet: join the Pi's own temporary Wi-Fi to finish setup. -->
  <section class="setup" id="setup-wifi" hidden>
    <img class="setup-qr" id="setup-wifi-qr" alt="" width="264" height="264">
    <div class="setup-text">
      <h2 id="setup-wifi-title"></h2>
      <p id="setup-wifi-help"></p>
    </div>
  </section>
</body>
</html>
